services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-lingua}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: linguadb
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - lingua_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lingua} -d linguadb" ]
      interval: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/linguadb
      DB_USERNAME: ${DB_USERNAME:-lingua}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"

volumes:
  lingua_data: