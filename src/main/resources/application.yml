# Cú pháp YAML (thụt dòng + dấu :) — chỉ dùng trong file .yml
spring:
  application:
    name: linguacore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/linguadb}
    username: ${DB_USERNAME:lingua}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}